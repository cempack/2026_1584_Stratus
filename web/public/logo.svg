      <stop offset="0" stop-color="#1A1F29"/>
      <stop offset="1" stop-color="#0B0E14"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#F5B544" stop-opacity="0"/>
      <stop offset=".45" stop-color="#F5B544"/>
      <stop offset="1" stop-color="#FFD58A"/>
    </linearGradient>
    <clipPath id="globe"><circle cx="30" cy="34" r="17"/></clipPath>
