<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Stratus">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A1330"/>
      <stop offset="0.38" stop-color="#1E2B63"/>
      <stop offset="0.6" stop-color="#5B3F7C"/>
      <stop offset="0.74" stop-color="#E0794F"/>
      <stop offset="0.84" stop-color="#F6B85C"/>
    </linearGradient>
    <radialGradient id="sun" cx="32" cy="47" r="26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE3A3" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#F7A55A" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F7A55A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloudA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF4E2"/>
      <stop offset="1" stop-color="#F3B98C"/>
    </linearGradient>
    <linearGradient id="cloudB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F9D9C0"/>
      <stop offset="1" stop-color="#B9779A"/>
    </linearGradient>
    <linearGradient id="cloudC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9C6E9E"/>
      <stop offset="1" stop-color="#3B3466"/>
    </linearGradient>
    <linearGradient id="trail" gradientUnits="userSpaceOnUse" x1="8" y1="41" x2="37.6" y2="24.4">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.85"/>
    </linearGradient>
    <clipPath id="tile"><rect width="64" height="64" rx="14.5"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="64" height="64" fill="url(#sky)"/>
    <circle cx="32" cy="47" r="26" fill="url(#sun)"/>
    <g fill="#FFFFFF">
      <circle cx="11" cy="9" r="0.7" opacity="0.8"/><circle cx="20" cy="5.5" r="0.5" opacity="0.6"/>
      <circle cx="7" cy="19" r="0.45" opacity="0.5"/><circle cx="27" cy="12" r="0.4" opacity="0.45"/>
    </g>
    <!-- the stratus deck: three lit layers -->
    <rect x="-6" y="42.5" width="46" height="5" rx="2.5" fill="url(#cloudA)"/>
    <rect x="24" y="45.5" width="48" height="5.5" rx="2.75" fill="url(#cloudA)" opacity="0.92"/>
    <rect x="-8" y="49.5" width="58" height="7" rx="3.5" fill="url(#cloudB)"/>
    <rect x="-4" y="55.5" width="76" height="12" rx="5" fill="url(#cloudC)"/>
    <!-- climb-out -->
    <path d="M8 41C20 37.5 29 31 37.6 24.4" fill="none" stroke="url(#trail)" stroke-width="1.2" stroke-linecap="round"/>
    <path transform="translate(44.5 19) rotate(52) scale(0.26) translate(-32 -32)" d="M32 2.5L33.3 3.7L34.3 6.2L34.9 9.8L35 13.5L35 23.5L57.5 35.6L58.4 38.4L35.2 32.8L35 46L34.4 50.2L44.6 56.2L44.6 59L33.7 57.2L33 60.6L32 61.6L31 60.6L30.3 57.2L19.4 59L19.4 56.2L29.6 50.2L29 46L28.8 32.8L5.6 38.4L6.5 35.6L29 23.5L29 13.5L29.1 9.8L29.7 6.2L30.7 3.7zM40.2 24.4L42.8 24.4L42.8 31.2L40.2 31.2zM23.8 31.2L21.2 31.2L21.2 24.4L23.8 24.4z" fill="#FFFFFF"/>
  </g>
  <rect x="0.5" y="0.5" width="63" height="63" rx="14" fill="none" stroke="#FFFFFF" stroke-opacity="0.1"/>
</svg>
