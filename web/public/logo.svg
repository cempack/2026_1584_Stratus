  <!-- plane, nose along the arc tangent -->
  <g transform="translate(51.5 16.5) rotate(-59)">
    <path d="M7 0 2.6-1.1-3.2-6.4h-2.1l3 5.6-3.9-.3-1.6-2.1H-9l1 3.2-1 3.2h1.2l1.6-2.1 3.9-.3-3 5.6h2.1L2.6 1.1Z" fill="#FFFFFF"/>
